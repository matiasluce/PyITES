<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PyITES · Aprende Python jugando</title>
  <meta name="description" content="PyITES: aprende Python desde cero, nivel por nivel, al estilo de un juego. Sin conocimientos previos.">
  <meta name="theme-color" content="#2f80ed">
  <meta name="color-scheme" content="light dark">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><circle cx='60' cy='58' r='41' fill='%234a9be0'/><ellipse cx='60' cy='74' rx='26' ry='17' fill='%23ffe680'/><circle cx='46' cy='52' r='5' fill='%2316283a'/><circle cx='74' cy='52' r='5' fill='%2316283a'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- El orden importa: tokens define las variables que usan el resto. -->
  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/layout.css">
  <link rel="stylesheet" href="src/styles/path.css">
  <link rel="stylesheet" href="src/styles/profile.css">
  <link rel="stylesheet" href="src/styles/lesson.css">
  <link rel="stylesheet" href="src/styles/overlays.css">
</head>
<body>
  <!-- Contenedores que rellenan los módulos de src/js/ui y src/js/lesson -->
  <div id="app"></div>
  <div id="lesson" class="lesson hidden"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script type="module" src="src/js/main.js"></script>

  <!--
    Si alguien abre ESTE archivo con doble clic, el navegador bloquea los módulos ES
    por CORS y la página se queda en blanco sin explicar nada. Este aviso (script
    clásico, que sí funciona con file://) aparece en su lugar.

    Solo se activa si hay un módulo externo: en dist/pyites.html el módulo va embebido
    y ese archivo sí funciona con doble clic.
  -->
  <script>
    if (location.protocol === 'file:' && document.querySelector('script[type="module"][src]')) {
      document.getElementById('app').innerHTML = `
        <div style="max-width:34rem;margin:10vh auto;padding:2rem;text-align:center;
                    font-family:system-ui,'Segoe UI',sans-serif;color:#16283a">
          <div style="font-size:4rem;line-height:1">🐍</div>
          <h1 style="font-size:1.6rem;margin:.6rem 0">Casi. Ábrelo de otra manera</h1>
          <p style="line-height:1.6;color:#5a7085">
            Esta versión usa módulos de JavaScript y el navegador los bloquea al abrir la
            página directamente desde el disco. Elige una de las dos formas:
          </p>
          <div style="margin-top:1.6rem;display:grid;gap:1rem;text-align:left">
            <div style="border:1px solid #d8e3ee;border-radius:14px;padding:1rem 1.2rem">
              <b>1 · Para desarrollar</b>
              <p style="margin:.4rem 0 0;color:#5a7085">Abre una terminal en esta carpeta y ejecuta:</p>
              <pre style="margin:.6rem 0 0;padding:.7rem;background:#f4f8fc;border-radius:8px;overflow:auto">npm run dev</pre>
              <p style="margin:.5rem 0 0">Luego entra en <b>http://localhost:5173</b></p>
            </div>
            <div style="border:1px solid #d8e3ee;border-radius:14px;padding:1rem 1.2rem">
              <b>2 · Para usarlo o compartirlo</b>
              <p style="margin:.4rem 0 0;color:#5a7085">Genera el archivo único, que sí abre con doble clic:</p>
              <pre style="margin:.6rem 0 0;padding:.7rem;background:#f4f8fc;border-radius:8px;overflow:auto">npm run build</pre>
              <p style="margin:.5rem 0 0">Después abre <b>dist/pyites.html</b></p>
            </div>
          </div>
        </div>`;
    }
  </script>
</body>
</html>
