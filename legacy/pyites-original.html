<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PyITES · Aprende Python jugando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f8fc;--card:#ffffff;--line:#dfe7f0;--hover:#eef3f9;--text:#26364a;--muted:#6c7f95;
  --primary:#2f80ed;--primary-d:#1e63c4;--blue:#2f80ed;--blue-soft:#e6f0fd;
  --green:#58cc02;--green-d:#46a302;--green-soft:#e3f7cc;--green-text:#3b8a00;
  --red:#ff4b4b;--red-d:#d63a3a;--red-soft:#ffe3e3;--red-text:#d13232;
  --yellow:#ffd43b;--yellow-d:#d9a400;--orange:#ff9600;
  --locked:#e4e9ef;--locked-d:#c9d1db;--code-bg:#f2f6fb;
  --s-k:#7c3aed;--s-s:#15803d;--s-c:#8a9bb0;--s-n:#ea580c;--s-b:#2563eb;--s-d:#db2777;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1b26;--card:#182735;--line:#2a3f52;--hover:#1f3141;--text:#e7eef5;--muted:#93a7ba;
    --blue:#6aa9ff;--blue-soft:#1a3552;
    --green-soft:#1d3a12;--green-text:#84e03f;--red-soft:#43201f;--red-text:#ff8080;
    --locked:#2a3b4b;--locked-d:#1f2e3b;--code-bg:#0e1822;
    --s-k:#c4a1ff;--s-s:#7ee787;--s-c:#6b8299;--s-n:#ffa657;--s-b:#79b8ff;--s-d:#ff8ac4;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1b26;--card:#182735;--line:#2a3f52;--hover:#1f3141;--text:#e7eef5;--muted:#93a7ba;
  --blue:#6aa9ff;--blue-soft:#1a3552;
  --green-soft:#1d3a12;--green-text:#84e03f;--red-soft:#43201f;--red-text:#ff8080;
  --locked:#2a3b4b;--locked-d:#1f2e3b;--code-bg:#0e1822;
  --s-k:#c4a1ff;--s-s:#7ee787;--s-c:#6b8299;--s-n:#ffa657;--s-b:#79b8ff;--s-d:#ff8ac4;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html.noscroll{overflow:hidden}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:700;line-height:1.45;min-height:100%}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
code{font-family:var(--mono);font-size:.92em;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.hidden{display:none!important}

/* ---------- Botones ---------- */
.btn{border:0;border-radius:16px;padding:14px 26px;font-weight:900;font-size:16px;letter-spacing:.02em;color:#fff;background:var(--primary);box-shadow:0 4px 0 var(--primary-d);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 transparent}
.btn.green{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.ghost{background:var(--card);color:var(--primary);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost.danger{color:var(--red-text)}
.btn:disabled{background:var(--locked);color:var(--muted);box-shadow:0 4px 0 var(--locked-d);cursor:not-allowed;filter:none}
.btn.wide{min-width:180px}
.ib{border:0;background:transparent;color:var(--text);width:40px;height:40px;border-radius:12px;font-size:20px;display:grid;place-items:center;transition:background .15s}
.ib:hover{background:var(--hover)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px}

/* ---------- Mascota ---------- */
.mascot{width:100%;height:auto;display:block;overflow:visible}
.mascot-box{width:120px;flex:none;animation:bob 3.2s ease-in-out infinite}
.mascot-box.sm{width:64px}.mascot-box.xs{width:34px;animation:none}.mascot-box.lg{width:170px}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.tongue{transform-box:fill-box;transform-origin:50% 0;animation:flick 3s infinite}

/* ---------- Barra superior ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
.tb-in{max-width:1000px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:24px;letter-spacing:-.02em;color:var(--primary)}
.brand b{color:var(--yellow-d)}
.stats{display:flex;align-items:center;gap:2px}
.stat{display:flex;align-items:center;gap:6px;border:0;background:transparent;font-weight:900;font-size:17px;padding:8px 10px;border-radius:12px;color:var(--text)}
.stat:hover{background:var(--hover)}
.stat.streak{color:var(--orange)}
.stat.streak.off{color:var(--muted)}
.stat.streak.off .fl{filter:grayscale(1);opacity:.6}
.stat.xp{color:var(--yellow-d)}
.avatar{background:var(--primary)!important;color:#fff!important;font-weight:900;font-size:16px!important;border-radius:50%!important;margin-left:4px}

/* ---------- Layout inicio ---------- */
.layout{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:24px;padding:20px 16px 90px}
.path{width:100%;max-width:560px;margin:0 auto}
.side{display:none}
@media (min-width:980px){
  .layout{grid-template-columns:minmax(0,1fr) 340px;align-items:start}
  .side{display:block;position:sticky;top:calc(84px + env(safe-area-inset-top,0px));max-height:calc(100vh - 110px);overflow:auto}
  .only-mobile{display:none!important}
}
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.hello h2{font-size:22px;font-weight:900}
.hello p{color:var(--muted);font-size:14px}

.unit{--c:#58cc02;--cd:#46a302}
.ub{background:var(--c);color:#fff;border-radius:20px;padding:16px 18px;box-shadow:0 5px 0 var(--cd);display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 0 30px}
.ub small{opacity:.9;font-weight:900;font-size:13px}
.ub h3{font-size:21px;font-weight:900;line-height:1.2}
.ub p{font-size:14px;opacity:.95}
.ub .cnt{background:rgba(0,0,0,.16);border-radius:12px;padding:6px 10px;font-weight:900;font-size:14px;white-space:nowrap}
.row{display:flex;flex-direction:column;align-items:center;margin-bottom:26px;transform:translateX(var(--x,0px))}
.row.is-cur{margin-top:46px}
.node{width:78px;height:74px;border-radius:50%;border:0;background:var(--c);box-shadow:0 7px 0 var(--cd);font-size:32px;color:#fff;position:relative;display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--cd)}
.node.locked{background:var(--locked);box-shadow:0 7px 0 var(--locked-d);color:var(--muted);font-size:26px}
.node.locked:active{animation:shake .35s}
.node .badge{position:absolute;right:-4px;top:-4px;width:28px;height:28px;border-radius:50%;background:var(--yellow);color:#7a5200;font-size:15px;font-weight:900;display:grid;place-items:center;border:3px solid var(--bg);box-shadow:0 2px 0 var(--yellow-d)}
.node.cur::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:5px solid var(--c);opacity:.35;animation:ring 1.8s ease-out infinite}
.node.just{animation:pop .6s}
.bubble{position:absolute;top:-52px;left:50%;transform:translateX(-50%);background:var(--card);border:2px solid var(--line);color:var(--c);font-weight:900;padding:6px 14px;border-radius:14px;white-space:nowrap;animation:bobx 1.4s ease-in-out infinite;font-size:15px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.node-label{margin-top:14px;font-size:14px;font-weight:800;text-align:center;max-width:150px;color:var(--text)}
.row.lk .node-label{color:var(--muted)}
.finish{text-align:center;margin-top:10px}
.finish h3{font-size:22px;margin:8px 0 4px}

/* ---------- Perfil ---------- */
.prof-top{display:flex;align-items:center;gap:14px}
.prof-top .avatar{width:58px;height:58px;font-size:26px!important;margin:0;display:grid;place-items:center;border-radius:50%;background:var(--primary);color:#fff;font-weight:900;flex:none}
.pname{font-size:21px;font-weight:900;display:flex;align-items:center;gap:6px;word-break:break-word}
.ptitle{color:var(--muted);font-size:15px}
.mini{border:0;background:var(--hover);border-radius:8px;width:28px;height:28px;font-size:13px}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.ms{border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.ms b{display:block;font-size:20px;font-weight:900}
.ms span{font-size:12px;color:var(--muted)}
.psec{margin-top:16px}
.psec h4{font-size:15px;font-weight:900;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.psec h4 span{color:var(--muted);font-weight:700;font-size:13px}
.pbar{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--yellow);transition:width .6s}
.pbar.g i{background:var(--green)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{font-size:12px;color:var(--muted)}
.week span{display:grid;place-items:center;height:34px;border-radius:50%;margin-top:4px;background:var(--hover);font-size:16px;filter:grayscale(1);opacity:.5}
.week .on span{background:#fff1d6;filter:none;opacity:1}
.week .today span{outline:2px solid var(--primary);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{font-size:13px;padding:5px 10px;border-radius:99px;background:var(--yellow);color:#5c4100;font-weight:900}
.tchip.lock{background:var(--locked);color:var(--muted)}
.tchip.now{outline:3px solid var(--primary);outline-offset:1px}
.pact{display:grid;gap:10px;margin-top:20px}
.pact .btn{width:100%;padding:12px}

/* ---------- Bienvenida ---------- */
.welcome{min-height:100vh;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:grid;place-items:center;padding:24px;position:relative;overflow:hidden;background:radial-gradient(circle at 20% 10%,var(--blue-soft),transparent 45%),var(--bg)}
.wbox{position:relative;z-index:1;width:100%;max-width:420px;text-align:center}
.wbox h1{font-size:clamp(38px,9vw,52px);font-weight:900;letter-spacing:-.03em;color:var(--primary);margin-top:6px}
.wbox h1 b{color:var(--yellow-d)}
.wbox .lead{font-size:19px;margin:6px 0 26px;color:var(--text)}
.field{width:100%;font:800 19px var(--sans);padding:16px 18px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--text);outline:none;text-align:center;margin-bottom:16px}
.field:focus{border-color:var(--primary)}
.wbox .btn{width:100%;font-size:18px;padding:16px}
.wnote{margin-top:22px;color:var(--muted);font-size:14px}
.float{position:absolute;font:800 20px var(--mono);color:var(--primary);opacity:.16;animation:floaty 10s ease-in-out infinite;user-select:none;pointer-events:none}

/* ---------- Lección ---------- */
.lesson{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;animation:fadeIn .25s}
.l-head{display:flex;align-items:center;gap:14px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 8px;max-width:760px;width:100%;margin:0 auto}
.l-head .x{border:0;background:transparent;font-size:22px;color:var(--muted);width:36px;height:36px;border-radius:10px}
.l-head .x:hover{background:var(--hover)}
.bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .55s cubic-bezier(.3,1.3,.5,1);position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.hearts{font-weight:900;font-size:18px;color:var(--red);min-width:52px;text-align:right}
.hearts.hit{animation:shake .4s}
.l-body{flex:1;overflow:auto;padding:14px 20px 28px}
.l-inner{max-width:640px;margin:0 auto}
.q{font-size:clamp(21px,4.6vw,27px);font-weight:900;line-height:1.3;margin:6px 0 4px}
.tag{display:inline-block;background:var(--blue-soft);color:var(--blue);font-weight:900;font-size:13px;padding:4px 12px;border-radius:99px;margin-bottom:6px}
.tag.warn{background:#fff1d6;color:#a86400}
.teach{display:flex;gap:14px;align-items:flex-start;margin-top:10px}
.speech{position:relative;flex:1;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.speech::before{content:"";position:absolute;left:-9px;top:26px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.speech h2{font-size:21px;font-weight:900;margin-bottom:4px}
.speech p{font-size:17px;line-height:1.55}
@media (max-width:520px){.teach{flex-direction:column;align-items:stretch}.teach .mascot-box{align-self:flex-start;width:72px}.speech::before{left:28px;top:-9px;transform:rotate(135deg)}}

.code-wrap{background:var(--code-bg);border:2px solid var(--line);border-radius:16px;overflow:hidden;margin:16px 0}
.code-head{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:2px solid var(--line);font:700 12px var(--mono);color:var(--muted)}
.code-head i{width:10px;height:10px;border-radius:50%;background:#ff5f57}
.code-head i:nth-child(2){background:#febc2e}.code-head i:nth-child(3){background:#28c840}
.code-head span{margin-left:6px}
.code{margin:0;padding:14px 16px;font:600 15px/1.7 var(--mono);color:var(--text);overflow-x:auto;white-space:pre;tab-size:4}
.code .k{color:var(--s-k);font-weight:700}.code .s{color:var(--s-s)}.code .c{color:var(--s-c);font-style:italic}
.code .n{color:var(--s-n)}.code .b{color:var(--s-b)}.code .d{color:var(--s-d)}
.blank{font:700 15px var(--mono);color:var(--primary);background:var(--card);border:2px dashed var(--primary);border-radius:8px;padding:1px 6px;outline:none;text-align:center;min-width:4ch}
.blank:focus{border-style:solid}
.blank.ok{border-color:var(--green);color:var(--green-text);border-style:solid}
.blank.no{border-color:var(--red);color:var(--red-text);border-style:solid;animation:shake .4s}

.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:13px 16px;font-weight:800;font-size:17px;color:var(--text);transition:background .12s,border-color .12s,transform .08s}
.opt:hover:not(:disabled){background:var(--hover)}
.opt:active:not(:disabled){transform:translateY(2px)}
.opt .key{width:30px;height:30px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:14px;color:var(--muted);flex:none}
.opt.mono .otxt{font-family:var(--mono);font-size:15px;font-weight:700}
.opt.sel{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.opt.sel .key{border-color:var(--blue);color:var(--blue)}
.opt.ok{border-color:var(--green);background:var(--green-soft);color:var(--green-text)}
.opt.ok .key{border-color:var(--green);color:var(--green-text)}
.opt.no{border-color:var(--red);background:var(--red-soft);color:var(--red-text);animation:shake .4s}
.opt.no .key{border-color:var(--red);color:var(--red-text)}
.opt:disabled{cursor:default}

.zone{min-height:88px;margin-top:16px;padding:10px;border:2px dashed var(--line);border-radius:16px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.zone.ok{border-color:var(--green);background:var(--green-soft)}.zone.no{border-color:var(--red);background:var(--red-soft);animation:shake .4s}
.zone .hint{color:var(--muted);font-size:14px;margin:auto;font-weight:700}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px;min-height:60px}
.chip{font:700 15px var(--mono);white-space:pre;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;color:var(--text);animation:pop .2s}
.chip:hover{background:var(--hover)}
.chip:disabled{cursor:default}

.l-foot{border-top:2px solid var(--line);padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px))}
.l-foot.ok{background:var(--green-soft);border-color:transparent;animation:slideUp .28s}
.l-foot.bad{background:var(--red-soft);border-color:transparent;animation:slideUp .28s}
.foot-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.foot-in .btn{width:100%}
@media (min-width:640px){.foot-in{flex-direction:row;align-items:center;justify-content:space-between}.foot-in .btn{width:auto}.spacer{flex:1}}
.fb-msg{display:flex;gap:12px;align-items:flex-start;flex:1;min-width:0}
.fb-ico{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;flex:none}
.ok .fb-ico{color:var(--green)}.bad .fb-ico{color:var(--red)}
.fb-t{font-size:20px;font-weight:900}
.ok .fb-t{color:var(--green-text)}.bad .fb-t{color:var(--red-text)}
.fb-c{font-size:15px;margin-top:2px;color:var(--red-text)}
.fb-c code{white-space:pre-wrap;background:rgba(255,255,255,.55);border-color:transparent}
.fb-e{font-size:15px;margin-top:4px;font-weight:700;color:var(--text);opacity:.9}

.result{max-width:520px;margin:0 auto;text-align:center;padding-top:16px}
.result .mascot-box{margin:0 auto 6px}
.result h1{font-size:30px;font-weight:900;margin:8px 0 2px}
.result .sub{color:var(--muted);margin-bottom:22px}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rs{border:2px solid var(--c);border-radius:16px;overflow:hidden;background:var(--card)}
.rs b{display:block;background:var(--c);color:#fff;font-size:12px;padding:5px 2px}
.rs span{display:block;padding:14px 4px;font-size:22px;font-weight:900;color:var(--c)}
.rs.y{--c:var(--yellow-d)}.rs.g{--c:var(--green)}.rs.o{--c:var(--orange)}
.notes{display:grid;gap:10px;margin-top:20px}
.note{background:var(--blue-soft);color:var(--blue);border-radius:14px;padding:12px 14px;font-weight:800;font-size:15px;animation:pop .4s}

/* ---------- Modal / toast / confeti ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,14,22,.55);display:grid;place-items:center;padding:20px;z-index:80;animation:fadeIn .2s}
.modal{position:relative;background:var(--card);border-radius:24px;padding:24px;width:100%;max-width:420px;max-height:90vh;overflow:auto;animation:pop .28s;text-align:left}
.modal.center{text-align:center}
.modal h3{font-size:22px;font-weight:900;margin-bottom:8px}
.modal p{color:var(--muted);margin-bottom:18px}
.modal .btns{display:grid;gap:10px}
.modal .close{position:absolute;right:12px;top:12px;font-size:18px}
.modal .field{margin-bottom:14px}
.bigtitle{font-size:56px;margin:4px 0}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:800;z-index:95;animation:slideUp .25s;max-width:calc(100% - 32px);text-align:center;transition:opacity .35s}
.toast.out{opacity:0}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99;display:none}

/* ---------- Animaciones ---------- */
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes bobx{50%{transform:translate(-50%,-6px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}

<body>
<div id="app"></div>
<div id="lesson" class="lesson hidden"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<canvas id="confetti"></canvas>

<script>
/* =========================================================
   PyITES · aprende Python jugando
   ========================================================= */

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pad = n => String(n).padStart(2, '0');
const fmt = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => fmt(new Date());
const dnum = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
const dayDiff = (a, b) => Math.round(dnum(b) - dnum(a));

/* ---------- Estado y guardado ---------- */
const KEY = 'pyites:v1';
const defaults = () => ({ name: '', xp: 0, streak: 0, best: 0, lastActive: '', days: [], done: {}, sound: true, daily: { date: '', xp: 0 } });
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(defaults(), JSON.parse(raw)); } catch (e) {}
  return defaults();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
let state = load();

const GOAL = 50;
const TITLES = [
  { min: 0,    name: 'Principiante', icon: '🐣' },
  { min: 200,  name: 'Aprendiz',     icon: '🌱' },
  { min: 600,  name: 'Intermedio',   icon: '🔥' },
  { min: 1100, name: 'Avanzado',     icon: '⚡' },
  { min: 1700, name: 'Experto',      icon: '👑' }
];
const titleIdx = xp => TITLES.reduce((r, t, i) => xp >= t.min ? i : r, 0);
const streakNow = () => state.lastActive && dayDiff(state.lastActive, today()) <= 1 ? state.streak : 0;
const dailyXP = () => state.daily.date === today() ? state.daily.xp : 0;
function markActive() {
  const t = today();
  if (state.lastActive === t) return false;
  const d = state.lastActive ? dayDiff(state.lastActive, t) : 99;
  state.streak = d === 1 ? state.streak + 1 : 1;
  state.best = Math.max(state.best || 0, state.streak);
  state.lastActive = t;
  if (!state.days.includes(t)) state.days.push(t);
  state.days = state.days.slice(-60);
  save();
  return true;
}

/* ---------- Sonidos (Web Audio, sin archivos externos) ---------- */
const Sound = (() => {
  let ctx = null;
  const ensure = () => {
    if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  function tone(f, at, dur, type = 'sine', vol = .14, to) {
    const c = ensure(); if (!c) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .03);
  }
  const S = {
    tick:    () => tone(700, 0, .06, 'triangle', .07),
    pop:     () => tone(480, 0, .09, 'sine', .12, 620),
    correct: () => { tone(659, 0, .14, 'triangle', .16); tone(988, .1, .26, 'triangle', .16); },
    wrong:   () => { tone(240, 0, .2, 'sawtooth', .08, 170); tone(160, .16, .3, 'sawtooth', .08, 110); },
    win:     () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .12, .32, 'triangle', .16)); tone(1319, .5, .6, 'sine', .14); },
    fail:    () => { [392, 330, 262].forEach((f, i) => tone(f, i * .18, .34, 'triangle', .13)); },
    levelup: () => { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .09, .3, 'square', .07)); tone(1568, .6, .8, 'triangle', .14); }
  };
  return { play(n) { if (state.sound && S[n]) { try { S[n](); } catch (e) {} } } };
})();

/* ---------- Resaltado de sintaxis Python ---------- */
const KW = 'def|return|if|elif|else|for|while|in|not|and|or|import|from|as|class|try|except|finally|with|lambda|True|False|None|break|continue|pass|yield|is|raise';
const BI = 'print|input|len|range|int|str|float|bool|list|dict|set|tuple|type|sum|min|max|sorted|open|map|filter|super|enumerate|zip|round|abs|sqrt|randint';
const HL_RE = new RegExp('(#.*$)|("(?:[^"\\\\]|\\\\.)*"|\'(?:[^\'\\\\]|\\\\.)*\')|(\\b\\d+(?:\\.\\d+)?\\b)|(\\b(?:' + KW + ')\\b)|(\\b(?:' + BI + ')\\b)|(@\\w+)|(\\bself\\b)', 'gm');
function hl(code) {
  const s = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return s.replace(HL_RE, (m, c, st, n, k, b, d, sf) =>
    c ? `<span class="c">${m}</span>` : st ? `<span class="s">${m}</span>` : n ? `<span class="n">${m}</span>` :
    k ? `<span class="k">${m}</span>` : b ? `<span class="b">${m}</span>` : d ? `<span class="d">${m}</span>` : `<span class="n">${m}</span>`);
}
const codeHead = () => '<div class="code-head"><i></i><i></i><i></i><span>main.py</span></div>';
const codeBlock = c => `<div class="code-wrap">${codeHead()}<pre class="code"><code>${hl(c)}</code></pre></div>`;

/* ---------- Mascota: Pyti ---------- */
function mascot(size = '', mood = 'happy') {
  const mouth = mood === 'sad' ? 'M48 79 Q60 70 72 79' : 'M46 71 Q60 84 74 71';
  const tongue = mood === 'sad' ? '' : '<path class="tongue" d="M60 80 v9 m0 0 l-4 5 m4 -5 l4 5" stroke="#ff4b4b" stroke-width="3" fill="none" stroke-linecap="round"/>';
  const tear = mood === 'sad' ? '<path d="M35 64 q-4 8 0 11 q4 -3 0 -11z" fill="#8fd3ff"/>' : '';
  return `<div class="mascot-box ${size}"><svg class="mascot" viewBox="0 0 120 120" aria-hidden="true">
    <ellipse cx="60" cy="104" rx="42" ry="13" fill="#2a5f96"/>
    <ellipse cx="60" cy="100" rx="42" ry="13" fill="#3776ab"/>
    <path d="M22 100 q38 12 76 0" stroke="#ffd43b" stroke-width="5" fill="none" stroke-linecap="round" opacity=".9"/>
    <circle cx="60" cy="58" r="41" fill="#4a9be0"/>
    <path d="M40 24 q20 -12 40 0" stroke="#ffd43b" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="60" cy="74" rx="26" ry="17" fill="#ffe680"/>
    <g class="eye"><circle cx="43" cy="50" r="12" fill="#fff"/><circle cx="45" cy="52" r="6" fill="#16283a"/><circle cx="47.5" cy="49.5" r="2" fill="#fff"/></g>
    <g class="eye"><circle cx="77" cy="50" r="12" fill="#fff"/><circle cx="75" cy="52" r="6" fill="#16283a"/><circle cx="77.5" cy="49.5" r="2" fill="#fff"/></g>
    <circle cx="27" cy="68" r="5" fill="#ff9bb0" opacity=".7"/><circle cx="93" cy="68" r="5" fill="#ff9bb0" opacity=".7"/>
    <circle cx="54" cy="66" r="1.7" fill="#2a5f96"/><circle cx="66" cy="66" r="1.7" fill="#2a5f96"/>
    <path d="${mouth}" stroke="#16283a" stroke-width="3" fill="none" stroke-linecap="round"/>
    ${tongue}${tear}
  </svg></div>`;
}

function toast(msg) {

  setTimeout(() => t.classList.add('out'), 2200); setTimeout(() => t.remove(), 2700);

function confetti(n = 150) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.display = 'block'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ['#58cc02', '#1cb0f6', '#ffd43b', '#ff4b4b', '#ce82ff', '#ff9600'];
  const P = Array.from({ length: n }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .4, vx: (Math.random() - .5) * 15, vy: -Math.random() * 15 - 4, g: .35 + Math.random() * .2, s: 6 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.random() * cols.length | 0] }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, W, H);
    P.forEach(p => { p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .6); ctx.restore(); });
    if (++f < 160) requestAnimationFrame(tick); else { ctx.clearRect(0, 0, W, H); cv.style.display = 'none'; }
  })();
}

/* =========================================================
   LECCIONES

let L = null;
const norm = s => s.replace(/\s+/g, '').replace(/'/g, '"');
const isMono = t => /[()\[\]{}=_#"'<>@*]/.test(t) || /^-?\d+(\.\d+)?$/.test(t);

function prep(x, id, retry = false) {
  const e = { ...x, id, src: x, retry };
  if (x.t === 'mc') e.opts = shuffle(x.o.map((t, i) => ({ t, ok: i === x.a })));
  if (x.t === 'od') { e.bank = shuffle(x.tk.map((t, i) => ({ t, i }))); if (e.bank.length > 1 && e.bank.every((b, k) => b.i === k)) e.bank.reverse(); }
  if (x.t === 'fi') e.parts = x.c.split('___');
  return e;
}

function startLesson(g) {
  const f = FLAT[g];
  L = { g, f, first: !state.done[f.id], phase: 'learn', step: 0, queue: f.lesson.ex.map((x, i) => prep(x, i)), total: f.lesson.ex.length,
        solved: new Set(), missed: new Set(), hearts: 5, mistakes: 0, xp: 0, newDay: false, checked: false, val: '', sel: -1, placed: [] };
  document.documentElement.classList.add('noscroll');
  const el = $('#lesson'); el.classList.remove('hidden');
  el.innerHTML = `<div class="l-head"><button class="x" data-act="quit" aria-label="Salir de la lección">✕</button>
    <div class="bar"><i id="lbar"></i></div><div class="hearts" id="hearts"></div></div>
    <div class="l-body" id="lb"><div class="l-inner" id="li"></div></div><div class="l-foot" id="lf"></div>`;
  updateHead(); showLearn();
}
function closeLesson() {
  $('#lesson').classList.add('hidden'); $('#lesson').innerHTML = '';
  document.documentElement.classList.remove('noscroll'); L = null;
}
function updateHead() {
  $('#lbar').style.width = Math.round(L.solved.size / L.total * 100) + '%';
  $('#hearts').textContent = '❤️ ' + L.hearts;
}
const setCheck = v => { const b = $('#checkbtn'); if (b) b.disabled = !v; };
function scrollTop() { const b = $('#lb'); if (b) b.scrollTop = 0; }

function showLearn() {
  const cards = L.f.lesson.learn, c = cards[L.step], last = L.step === cards.length - 1;
  $('#li').innerHTML = `<span class="tag">💡 Aprende ${L.step + 1}/${cards.length}</span>
    <div class="teach">${mascot('sm')}<div class="speech"><h2>${c.h}</h2><p>${c.p}</p></div></div>${codeBlock(c.code)}`;
  const lf = $('#lf'); lf.className = 'l-foot';
  lf.innerHTML = `<div class="foot-in">${!L.first && last ? '<button class="btn ghost" data-act="skipLearn">Saltar</button>' : '<span class="spacer"></span>'}
    <button class="btn green wide" data-act="learnNext">${last ? 'Ir a los ejercicios' : 'Continuar'}</button></div>`;
  scrollTop();
}

function exHTML(e) {
  let h = `${e.retry ? '<span class="tag warn">🔁 Repaso</span>' : '<span class="tag">Practica</span>'}<h2 class="q">${esc(e.q)}</h2>`;
  if (e.t === 'mc') {
    if (e.c) h += codeBlock(e.c);
    h += '<div class="opts">' + e.opts.map((o, i) => `<button class="opt ${isMono(o.t) ? 'mono' : ''}" data-act="opt" data-i="${i}"><span class="key">${i + 1}</span><span class="otxt">${esc(o.t)}</span></button>`).join('') + '</div>';
  } else if (e.t === 'fi') {
    const w = Math.max(...e.a.map(a => a.length)) + 3;
    const inp = `<input id="blank" class="blank" style="width:${w}ch" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Respuesta">`;
    h += `<div class="code-wrap">${codeHead()}<pre class="code"><code>${e.parts.map(hl).join(inp)}</code></pre></div>`;
  } else {
    h += '<div class="zone" id="zone"></div><div class="bank" id="bank"></div>';
  }
  return h;
}
function renderOd() {
  const e = L.queue[0];
  $('#zone').innerHTML = L.placed.length ? L.placed.map(i => `<button class="chip" data-act="unplace" data-i="${i}">${esc(e.tk[i])}</button>`).join('') : '<span class="hint">Toca las piezas para armar la respuesta</span>';
  $('#bank').innerHTML = e.bank.filter(x => !L.placed.includes(x.i)).map(x => `<button class="chip" data-act="place" data-i="${x.i}">${esc(x.t)}</button>`).join('');
  setCheck(L.placed.length > 0);
}
function showEx() {
  const e = L.queue[0];
  L.checked = false; L.val = ''; L.sel = -1; L.placed = [];
  $('#li').innerHTML = exHTML(e);
  const lf = $('#lf'); lf.className = 'l-foot';
  lf.innerHTML = '<div class="foot-in"><span class="spacer"></span><button id="checkbtn" class="btn green wide" data-act="check" disabled>Comprobar</button></div>';
  if (e.t === 'od') renderOd();
  if (e.t === 'fi') setTimeout(() => { const i = $('#blank'); if (i) i.focus(); }, 60);
  updateHead(); scrollTop();
}

function check() {
  if (!L || L.checked) return;
  const e = L.queue[0]; let ok = false, ans = '';
  if (e.t === 'mc') { if (L.sel < 0) return; ok = e.opts[L.sel].ok; ans = e.opts.find(o => o.ok).t; }
  else if (e.t === 'fi') { if (!L.val.trim()) return; ok = e.a.some(a => norm(a) === norm(L.val)); ans = e.a[0]; }
  else { if (!L.placed.length) return; ok = L.placed.map(i => e.tk[i]).join('\u0001') === e.tk.join('\u0001'); ans = e.tk.join(e.s); }
  L.checked = true;

  /* marca visual */
  if (e.t === 'mc') document.querySelectorAll('.opt').forEach((b, i) => { b.disabled = true; b.classList.remove('sel'); if (e.opts[i].ok) b.classList.add('ok'); else if (i === L.sel) b.classList.add('no'); });
  if (e.t === 'fi') { const i = $('#blank'); i.readOnly = true; i.blur(); i.classList.add(ok ? 'ok' : 'no'); }
  if (e.t === 'od') { $('#zone').classList.add(ok ? 'ok' : 'no'); document.querySelectorAll('.chip').forEach(c => c.disabled = true); }

  /* lógica */
  L.queue.shift();
  if (ok) {
    if (!L.solved.has(e.id)) { L.solved.add(e.id); L.xp += L.missed.has(e.id) ? 5 : 10; }
    if (markActive()) L.newDay = true;
    Sound.play('correct');
  } else {
    L.mistakes++; L.missed.add(e.id); L.hearts--;
    L.queue.push(prep(e.src, e.id, true));
    Sound.play('wrong');
    const h = $('#hearts'); h.classList.remove('hit'); void h.offsetWidth; h.classList.add('hit');
  }
  updateHead();

  const okT = ['¡Excelente!', '¡Muy bien!', '¡Correcto!', '¡Genial!', '¡Así se hace!'], badT = ['Casi, ¡no te rindas!', 'Ups, esa no era', 'Sigue intentando'];
  const pick = a => a[Math.random() * a.length | 0];
  const lf = $('#lf'); lf.className = 'l-foot ' + (ok ? 'ok' : 'bad');
  lf.innerHTML = `<div class="foot-in"><div class="fb-msg"><div class="fb-ico">${ok ? '✓' : '✕'}</div><div>
      <div class="fb-t">${ok ? pick(okT) : pick(badT)}</div>
      ${ok ? '' : `<div class="fb-c">Respuesta correcta: <code>${esc(ans)}</code></div>`}
      ${e.e ? `<div class="fb-e">${esc(e.e)}</div>` : ''}</div></div>
    <button class="btn ${ok ? 'green' : 'red'} wide" data-act="next">Continuar</button></div>`;
  const nb = lf.querySelector('.btn'); if (nb) nb.focus({ preventScroll: true });
}

function next() {
  if (!L || !L.checked) return;
  if (L.hearts <= 0) return showFail();
  if (!L.queue.length) return complete();
  showEx();
}

function showFail() {
  Sound.play('fail');
  $('#li').innerHTML = `<div class="result">${mascot('lg', 'sad')}<h1>¡Te quedaste sin vidas!</h1>
    <p class="sub">No pasa nada: equivocarse es parte de aprender. Repasa la explicación y vuelve a intentarlo.</p></div>`;
  const lf = $('#lf'); lf.className = 'l-foot';
  lf.innerHTML = '<div class="foot-in"><button class="btn ghost" data-act="exit">Salir</button><button class="btn green wide" data-act="retry">Intentar de nuevo</button></div>';
}

function complete() {
  const f = L.f, prev = titleIdx(state.xp);
  const perfect = L.mistakes === 0;
  let gain = L.xp + (L.first ? 20 + (perfect ? 10 : 0) : 0);
  if (!L.first) gain = Math.round(gain / 2);
  const acc = Math.round(L.total / (L.total + L.mistakes) * 100);
  state.xp += gain;
  state.daily = { date: today(), xp: dailyXP() + gain };
  const rec = state.done[f.id] || { plays: 0, best: 0 };
  rec.plays++; rec.best = Math.max(rec.best, acc); state.done[f.id] = rec;
  save();
  L.result = { titleUp: titleIdx(state.xp) > prev };
  const unitDone = L.first && f.unit.lessons.every((_, li) => state.done[`u${f.ui}l${li}`]);
  const allDone = L.first && FLAT.every(x => state.done[x.id]);
  const goalHit = dailyXP() >= GOAL && dailyXP() - gain < GOAL;
  justDone = f.id;

  const notes = [];
  if (L.newDay) notes.push(`<div class="note">🔥 ¡Racha de ${state.streak} ${state.streak === 1 ? 'día' : 'días'}!</div>`);
  if (goalHit) notes.push('<div class="note">🎯 ¡Meta diaria cumplida!</div>');
  if (unitDone) notes.push(`<div class="note">🏅 ¡Completaste la unidad "${esc(f.unit.title)}"!</div>`);
  if (allDone) notes.push('<div class="note">🏆 ¡Terminaste todo el curso!</div>');
  if (!L.first) notes.push('<div class="note">🔁 Práctica: los puntos de un repaso valen la mitad.</div>');
  if (perfect) notes.push('<div class="note">✨ ¡Lección perfecta, sin errores!</div>');

  $('#lbar').style.width = '100%';
  $('#li').innerHTML = `<div class="result">${mascot('lg')}<h1>¡Lección completada!</h1><p class="sub">${esc(f.lesson.title)}</p>
    <div class="rstats"><div class="rs y"><b>Puntos</b><span>⭐ +${gain}</span></div><div class="rs g"><b>Precisión</b><span>🎯 ${acc}%</span></div><div class="rs o"><b>Racha</b><span>🔥 ${streakNow()}</span></div></div>
    <div class="notes">${notes.join('')}</div></div>`;
  const lf = $('#lf'); lf.className = 'l-foot';
  lf.innerHTML = '<div class="foot-in"><span class="spacer"></span><button class="btn green wide" data-act="finish">Continuar</button></div>';
  Sound.play('win'); confetti(perfect ? 220 : 140); scrollTop();
}

function afterLesson() {
  const up = L && L.result && L.result.titleUp;
  closeLesson();
  refreshAll();
  setTimeout(() => { const n = document.querySelector('.node.cur') || document.querySelector('.node.just'); if (n) n.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 80);
  if (up) setTimeout(() => {
    const T = TITLES[titleIdx(state.xp)];
    Sound.play('levelup'); confetti(200);
    openModal(`${mascot('')}<div class="bigtitle">${T.icon}</div><h3>¡Nuevo título!</h3><p>Ahora eres <b>${T.name}</b>. ¡Sigue así, ${esc(state.name)}!</p><div class="btns"><button class="btn green" data-act="closeModal">¡Genial!</button></div>`, 'center');
  }, 350);
  setTimeout(() => { justDone = null; }, 1500);
}

/* ---------- Acciones ---------- */
const H = {
  start() {
    const v = $('#nameIn').value.trim();
    if (!v) { const i = $('#nameIn'); i.style.animation = 'none'; void i.offsetWidth; i.style.animation = 'shake .4s'; i.focus(); Sound.play('wrong'); return; }
    state.name = v.slice(0, 20); save(); Sound.play('win'); renderHome();
  },
  lesson(t) {
    const g = +t.dataset.g;
    if (g > curIdx()) { toast('Completa la lección anterior para desbloquear esta.'); Sound.play('wrong'); return; }
    startLesson(g);
  },
  profile() { openModal('<button class="ib close" data-act="closeModal" aria-label="Cerrar">✕</button>' + profileHTML()); },
  sound() { state.sound = !state.sound; save(); if (state.sound) Sound.play('pop'); refreshAll(); if ($('#overlay .prof')) { const m = $('#overlay .modal'); m.innerHTML = '<button class="ib close" data-act="closeModal" aria-label="Cerrar">✕</button>' + profileHTML(); } },
  closeModal() { closeModal(); },
  quit() { openModal('<h3>¿Salir de la lección?</h3><p>Perderás el avance de esta lección.</p><div class="btns"><button class="btn green" data-act="closeModal">Seguir aprendiendo</button><button class="btn ghost danger" data-act="exit">Salir</button></div>', 'center'); },
  exit() { closeModal(); closeLesson(); refreshAll(); },
  learnNext() { const n = L.f.lesson.learn.length; if (L.step < n - 1) { L.step++; showLearn(); } else { L.phase = 'ex'; showEx(); } },
  skipLearn() { L.phase = 'ex'; showEx(); },
  opt(t) { if (L.checked) return; Sound.play('tick'); L.sel = +t.dataset.i; document.querySelectorAll('.opt').forEach(b => b.classList.toggle('sel', b === t)); setCheck(true); },
  place(t) { if (L.checked) return; Sound.play('tick'); L.placed.push(+t.dataset.i); renderOd(); },
  unplace(t) { if (L.checked) return; Sound.play('tick'); const i = +t.dataset.i; L.placed = L.placed.filter(x => x !== i); renderOd(); },
  check, next,
  retry() { const f = L.g; closeLesson(); startLesson(f); },
  finish() { afterLesson(); },
  reset() {
    openModal('<h3>¿Resetear tu progreso?</h3><p>Se borrarán tus puntos, tu racha, tus títulos y las lecciones completadas. Tu nombre se mantiene. Esta acción no se puede deshacer.</p><div class="btns"><button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn red" data-act="resetYes">Sí, resetear</button></div>', 'center');
  },
  resetYes() {
    const keep = { name: state.name, sound: state.sound };
    state = Object.assign(defaults(), keep); save(); justDone = null;
    closeModal(); Sound.play('fail'); refreshAll(); toast('Progreso reiniciado. ¡A empezar de nuevo!');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  },
  editname() {
    openModal(`<h3>Tu nombre</h3><input id="nameEdit" class="field" maxlength="20" value="${esc(state.name)}" autocomplete="off" aria-label="Nombre"><div class="btns"><button class="btn green" data-act="savename">Guardar</button><button class="btn ghost" data-act="closeModal">Cancelar</button></div>`);
    setTimeout(() => { const i = $('#nameEdit'); if (i) { i.focus(); i.select(); } }, 60);
  },
  savename() { const v = $('#nameEdit').value.trim(); if (!v) return; state.name = v.slice(0, 20); save(); closeModal(); refreshAll(); toast('Nombre actualizado'); }
};
const NOPOP = ['check', 'opt', 'place', 'unplace', 'sound', 'start', 'resetYes'];
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (!NOPOP.includes(a)) Sound.play('pop');
  if (H[a]) H[a](t, e);
});
document.addEventListener('input', e => {
  if (e.target.id === 'blank' && L && !L.checked) { L.val = e.target.value; setCheck(L.val.trim().length > 0); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#overlay')) closeModal(); return; }
  if (e.repeat) return;
  const t = e.target;
  if (e.key === 'Enter') {
    if (t.id === 'nameIn') { e.preventDefault(); H.start(); return; }
    if (t.id === 'nameEdit') { e.preventDefault(); H.savename(); return; }
    if ($('#overlay')) return;
    if (L) { const b = document.querySelector('#lf .btn:not([disabled])'); if (b && t.tagName !== 'BUTTON') { e.preventDefault(); b.click(); } else if (b && t.tagName === 'BUTTON' && t.closest('#lf')) { /* el botón enfocado responde solo */ } else if (b && !$('#overlay')) { e.preventDefault(); b.click(); } }
  }
  if (L && !L.checked && /^[1-9]$/.test(e.key) && t.tagName !== 'INPUT') {
    const o = document.querySelectorAll('.opt')[+e.key - 1]; if (o) o.click();
  }
});

/* ---------- Inicio ---------- */
render();
</script>
</body>
</html>
